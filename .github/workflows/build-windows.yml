name: Build Windows app

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Also tag this commit with the app version and make a draft release'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      AUDIVERIS_VERSION: '5.11.0'
    steps:
      - uses: actions/checkout@v4

      - name: Check the release tag is free (manual release only)
        if: github.event_name == 'workflow_dispatch' && inputs.release
        shell: pwsh
        run: |
          $v = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = "v$v"
          git fetch --tags --quiet
          if (git tag --list $tag) { throw "Tag $tag already exists. Bump the version in desktop/package.json first." }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Will release $tag"

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Fetch pdf.js (legacy build, which also runs on older Chromium)
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          npm install --no-audit --no-fund --prefix pdfjs pdfjs-dist@6.2.108
          "PDFJS_BUILD=" + (Resolve-Path 'pdfjs/node_modules/pdfjs-dist/legacy/build').Path | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the web app
        run: python -I build.py

      - name: Copy the web app into the desktop shell
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/app | Out-Null
          Copy-Item dist/nish_marksteady_piano_v2_0_0.html desktop/app/index.html

      - name: Fetch and unpack Audiveris (console build, with its own Java)
        shell: pwsh
        run: |
          $v = $env:AUDIVERIS_VERSION
          $names = @("Audiveris-$v-windowsConsole-x86_64.msi", "Audiveris-$v-windows-x86_64.msi")
          $msi = $null
          foreach ($n in $names) {
            try {
              Invoke-WebRequest "https://github.com/Audiveris/audiveris/releases/download/$v/$n" -OutFile $n -ErrorAction Stop
              $msi = $n; break
            } catch { Write-Host "Not found: $n" }
          }
          if (-not $msi) { throw "No Audiveris installer found for $v" }
          $target = Join-Path $env:RUNNER_TEMP 'audiveris-extract'
          Start-Process msiexec.exe -Wait -ArgumentList @('/a', (Resolve-Path $msi), '/qn', "TARGETDIR=$target")
          $exe = Get-ChildItem $target -Recurse -Filter 'Audiveris.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Audiveris.exe not found after unpacking' }
          New-Item -ItemType Directory -Force desktop/resources/audiveris | Out-Null
          Copy-Item (Join-Path $exe.DirectoryName '*') desktop/resources/audiveris -Recurse -Force
          Invoke-WebRequest 'https://raw.githubusercontent.com/Audiveris/audiveris/master/LICENSE' -OutFile desktop/licenses/AUDIVERIS-LICENSE.txt
          "{0:N0} MB Audiveris" -f ((Get-ChildItem desktop/resources/audiveris -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Smoke test the reader on a generated low-resolution page
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'omr-test'
          New-Item -ItemType Directory -Force $out | Out-Null
          & desktop/resources/audiveris/Audiveris.exe -batch -export -output $out -- tests/scan/smoke_page.png
          Get-ChildItem $out -Recurse | Format-Table Name, Length
          if (-not (Get-ChildItem $out -Recurse -Filter *.mxl)) { Write-Warning 'Audiveris produced no MusicXML for the smoke page' }

      - name: Fetch RtAudio 6.0.1 (with the ASIO host files)
        shell: pwsh
        run: |
          git clone --depth 1 --branch 6.0.1 https://github.com/thestk/rtaudio.git "$env:RUNNER_TEMP/rtaudio"
          Get-ChildItem "$env:RUNNER_TEMP/rtaudio/include" | Format-Table Name, Length
          Copy-Item "$env:RUNNER_TEMP/rtaudio/LICENSE" desktop/licenses/RTAUDIO-LICENSE.txt

      - name: Build the low-latency sound engine (ASIO)
        shell: pwsh
        run: |
          cmake -S native -B build-native -A x64 -DRTAUDIO_DIR="$env:RUNNER_TEMP/rtaudio"
          cmake --build build-native --config Release --parallel
          New-Item -ItemType Directory -Force desktop/resources/native | Out-Null
          Copy-Item build-native/Release/nish-audio.exe desktop/resources/native/
          "{0:N0} KB nish-audio.exe" -f ((Get-Item desktop/resources/native/nish-audio.exe).Length / 1KB)

      - name: Fetch Upright Piano KW (FreePats, CC0) and build the sample bank
        shell: pwsh
        run: |
          $url = 'https://freepats.zenvoid.org/Piano/UprightPianoKW/UprightPianoKW-SFZ+FLAC-20220221.7z'
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP/upright.7z"
          "{0:N1} MB downloaded" -f ((Get-Item "$env:RUNNER_TEMP/upright.7z").Length / 1MB)
          7z x "$env:RUNNER_TEMP/upright.7z" "-o$env:RUNNER_TEMP/upright" -y | Out-Null
          Get-ChildItem -Recurse "$env:RUNNER_TEMP/upright" -Include *.sfz,*.txt | ForEach-Object { "  " + $_.FullName.Substring($env:RUNNER_TEMP.Length) }
          python -m pip install --quiet soundfile numpy
          # reads the SFZ, trims the silence before every note (fails if any attack still starts late), packs 16-bit PCM
          python tools/build_piano.py "$env:RUNNER_TEMP/upright" desktop/resources/sounds/upright-kw --name "Upright Piano KW"
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the piano sample bank' }
          Copy-Item native/sounds/UPRIGHT-KW-CREDITS.txt desktop/resources/sounds/upright-kw/CREDITS.txt
          Get-ChildItem desktop/resources/sounds/upright-kw | Format-Table Name, Length

      - name: Test the sound engine (synth checks, and the program starts and answers)
        shell: pwsh
        run: |
          & build-native/Release/nish-synth-test.exe desktop/resources/sounds/upright-kw
          if ($LASTEXITCODE -ne 0) { throw 'Synth checks failed' }
          # no ASIO driver on the build machine: the program must still start, list nothing, and quit cleanly
          $out = "list`nping 1`nquit`n" | & desktop/resources/native/nish-audio.exe
          $out | ForEach-Object { "  $_" }
          if (-not ($out -match '"ev":"ready"')) { throw 'nish-audio did not start' }
          if (-not ($out -match '"ev":"pong"')) { throw 'nish-audio did not answer' }
          if (-not ($out -match '"ev":"samples","ok":true')) { throw 'nish-audio did not load the Upright piano from the installation folder' }

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build installer, portable app and zip
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Bundle everything into one zip
        shell: pwsh
        run: |
          $rel = 'desktop/release'
          $pkg = Join-Path $env:RUNNER_TEMP 'NiSH-MarkSteady-Piano-Windows'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item "$rel/*.exe" $pkg
          Copy-Item desktop/licenses/* $pkg
          Copy-Item README-WINDOWS.txt $pkg
          Compress-Archive -Path "$pkg/*" -DestinationPath NiSH-MarkSteady-Piano-Windows.zip -Force
          "{0:N0} MB zip" -f ((Get-Item NiSH-MarkSteady-Piano-Windows.zip).Length / 1MB)

      - name: Keep the installer for testing
        uses: actions/upload-artifact@v4
        # only the installer (about 140 MB): the full zip would nearly fill a free private-repo quota.
        # A full quota must never stop the release below, so this step may fail without failing the build.
        continue-on-error: true
        with:
          name: NiSH-MarkSteady-Piano-Installer
          path: desktop/release/NiSH-MarkSteady-Piano-*-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NiSH-MarkSteady-Piano-Windows.zip
          draft: true

      - name: Tag this commit and make a draft release (manual release only)
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: NiSH MarkSteady Piano ${{ env.RELEASE_TAG }}
          files: NiSH-MarkSteady-Piano-Windows.zip
          draft: true
